[package]
name = "devalue"
# Tracks the npm package it reproduces, rather than the workspace. The two have to agree byte for
# byte, and devalue's own non-goals include stability of the serialization mechanism between
# versions, so the version is the only useful thing this can say about what it agrees with.
version = "5.9.2"
authors = ["Canmi <t@canmi.icu>"]
categories = ["encoding", "web-programming"]
edition.workspace = true
keywords = ["devalue", "serialization", "json", "hydration", "ssr"]
# Stated rather than inherited, because the crate is published on its own and a reader of the
# manifest should not have to find the workspace to learn the terms. LICENSE beside it is a link
# to the one at the root, which cargo resolves when it packages.
license = "MIT"
readme = "README.md"
repository.workspace = true
# What this is built and tested with, which is the toolchain the workspace pins. A lower floor
# could be worked out from the features the code uses, but nobody would have compiled it there,
# and a floor nobody has tried is a claim rather than a fact.
rust-version = "1.98"
description = "A Rust port of devalue, byte for byte with the JavaScript package of the same version."

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
