[package]
name = "lowering"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lowers a reduced Svelte markup tree into the Seam IR"

[lints]
workspace = true

[lib]
# `rlib` for the tests and the native binary, `cdylib` for the WebAssembly one. The second is
# what the compiler calls; see src/wasm.rs.
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
