# The TypeScript half of the monorepo. The Rust half is crates/, declared in a Cargo.toml that
# arrives with the first crate: cargo refuses a members glob that matches nothing, while pnpm
# is content with an empty workspace.
packages:
  - "pkgs/*"
  # Source taken from another project and kept as it was written; see vendor/kit/VENDOR.md.
  - "vendor/*"

# A package listed here may run arbitrary code during install. pnpm blocks that by default and
# the default is right -- an install script runs before anybody reads a line of the code.
# esbuild is allowed because it cannot work otherwise: the install step fetches and unpacks a
# platform-specific binary. Nothing goes in this list to silence a warning.
allowBuilds:
  esbuild: true
