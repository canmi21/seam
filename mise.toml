# Reached from the workspace as `//repos/seam:<task>`. Everything else this repository needs
# comes from one directory up: the formatters, the toolchain, the commit hooks. It declares no
# tools of its own because it needs none the workspace does not already carry.
#
# The layout is crates/ for Rust, pkgs/ for TypeScript, corpus/ for the fixtures both read, and
# vendor/ for source taken from elsewhere, which has checks of its own (see vendor/README.md).

[tasks.check]
description = "Type-check every package"
run = "pnpm exec tsc"

[tasks.check-rust]
description = "Type-check every crate"
run = "cargo check --workspace --all-targets"

[tasks.lint]
description = "Lint the packages"
run = "oxlint pkgs"

[tasks.lint-rust]
description = "Lint every crate, warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test-rust]
description = "Close the loop: markup fixture, lowering, the IR the specification describes"
run = "cargo test --workspace"

[tasks.test]
description = "Check every seam with Svelte: the AST we read, what we refuse, and the HTML we emit"
# The TypeScript checks call lowering through the WebAssembly build, so a change to a crate that
# is not followed by rebuilding it tests a compiler that no longer exists. Depending on `wasm`
# closes that: cargo and mise both skip work that is up to date, so an unchanged crate costs
# nothing here.
depends = ["wasm"]
# NODE_ENV before the runner rather than inside it. Svelte reads `DEV` from `esm-env`, which is
# true for any value that is set and does not begin with `prod`, and vitest sets `test`. Its
# development runtime writes a hash of the value into the anchor that opens a `{@html}` block, so
# the compiler would render bytes no server ships. `skeleton()` refuses to compile under it, and
# this is the environment it asks for. Setting it from inside the configuration is too late: the
# value is read when the module graph loads.
run = "NODE_ENV=production pnpm exec vitest run"

[tasks.apps]
description = "Build one of SvelteKit's own test apps with the plugin and run Kit's own specs against it"
# Stage two of spec/conformance.md, one app at a time: `mise run apps -- --app=basics
# --spec=server.test.js`, and `--plain` for Kit's own build of the same app, which is what a failure
# is read against. Not part of `verify` yet; see spec/conformance.md, "Stage 2".
run = "NODE_ENV=production node pkgs/apps/src/run.ts"

[tasks.test-vendor]
description = "Run SvelteKit's own checks over the vendored source, upstream's Node half"
# From the vendor directory, under its own config: the repository's `test` does not include it,
# and its config is not a `vitest.config.*` so the root run does not pick it up either. See
# vendor/kit/VENDOR.md.
dir = "vendor/kit"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks.wasm]
description = "Build the lowering pass as one WebAssembly file the compiler can call"
# Skipped by mise when the module is newer than every source it is built from, which is what
# lets `test` depend on it without paying for a build nothing changed.
sources = ["crates/**/*.rs", "crates/**/Cargo.toml", "Cargo.toml", "Cargo.lock"]
outputs = ["pkgs/lowering/lowering.wasm"]
# Run from the repository so the pinned toolchain is the one that resolves: outside it, the
# wasm target is not found, which fails in a way that names the wrong thing.
run = [
	"cargo build -q --release --target wasm32-unknown-unknown -p lowering",
	# Raw output carries the whole standard library. Dropping what nothing reaches takes it from
	# 1.6MB to 15KB, and the result runs identically.
	"wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --strip-debug --strip-producers target/wasm32-unknown-unknown/release/lowering.wasm -o pkgs/lowering/lowering.wasm",
	"ls -l pkgs/lowering/lowering.wasm",
]

[tasks.pack]
description = "Build what npm gets and pack each published package into .build-pack, publishing nothing"
# The packages and the layout are spec/publish.md's, and tsdown.config.ts lists them. Publishing
# is by hand, the tarballs here in the order the spec gives: `npm publish .build-pack/<file>`.
depends = ["wasm"]
run = '''
set -e
rm -rf .build-pack
pnpm exec tsdown
for dir in ast injector derive lowering routes skeleton carry compiler plugin create; do
	pnpm -C "pkgs/$dir" pack --pack-destination "$PWD/.build-pack" > /dev/null
done
ls -l .build-pack
'''

[tasks.fixtures]
description = "Regenerate the corpus after changing a case"
# The lowering module is not committed, so the step that needs it builds it.
depends = ["wasm"]
run = [
	"node corpus/generate.ts",
	"node crates/devalue/fixtures/generate.ts",
]

[tasks.verify]
description = "Everything a change has to pass"
# Our own checks, and the vendored corpus only as the list this repository keeps of it: upstream's
# tests are not a condition here, `vendor-baseline` holding every sample to pkgs/suite/baseline.json
# is. See spec/suite.md.
depends = [
	"check",
	"check-rust",
	"lint",
	"lint-rust",
	"lines",
	"test",
	"test-rust",
	"vendor-baseline",
]

[tasks.lines]
description = "Hold every file of ours under the line limits"
# The check is the workspace's, run over this repository: a file over a thousand lines fails, one
# over five hundred is advice until `audit`. See the workspace's spec/code.md, "A file is read
# whole, so it stays short".
run = "python3 ../../.mise/tasks/lines ."

[tasks.vendor-baseline]
description = "Svelte's own samples, each held to what pkgs/suite/baseline.json says it has to be"
# Two passes, the synchronous render and the one with `experimental.async` on, each in a process
# of its own and each measuring what upstream measures in that render; the two fold into one
# verdict per sample. See spec/suite.md.
#
# The failures and the skips by reason, then the table; `-- --table` is the table alone, and
# `-- --write` records the run as the list, refusing while anything fails. It exits non-zero while
# any sample disagrees with the list. See spec/suite.md.
#
# `-- --write --skip-failing` is the one way past that refusal, and only for this: a failing sample
# has been decided to be work that is owed, and what else moved still has to be recorded. The
# failing samples are left off the list and go on failing every run until the work is done.
depends = ["wasm"]
# The same reason `test` sets it: Svelte's development runtime writes a hash into the anchor that
# opens a `{@html}` block, so a compile under it renders bytes no server ships.
run = "NODE_ENV=production node pkgs/suite/src/run.ts"

# The verbs the workspace one directory up dispatches to: `mise run update|clean|fmt [name]`.
# Each takes --dry-run and keeps the promises the workspace's spec/architecture/repos.md lists
# under "What a repository's task owes the verb"; the revert after a failed verify is the
# workspace's, so `update` neither verifies nor reverts. `clean` is .mise/tasks/clean.
#
# cargo first, because the JavaScript half builds against what the Rust half lowers to. vendor/ is
# left out of the pnpm half: vendored source moves by taking a newer upstream, never by a resolver
# here -- see vendor/README.md. packageManager restates the workspace's pnpm for a build that has
# never heard of mise, so it is rewritten from what mise resolves rather than maintained.
[tasks.update]
description = "Move the crates and the packages within their ranges, and name what waits beyond: `update [--dry-run] [--major]`"
usage = '''
flag "-n --dry-run" help="Say what would move and write nothing"
flag "--major" help="Cross the ranges Cargo.toml and package.json declare"
'''
run = '''
n=${usage_dry_run:+--dry-run}
major=${usage_major:-}
if [ -n "$major" ]; then cargo upgrade --incompatible $n; fi
cargo update $n
echo
if [ -n "$n" ]; then
	echo '$ pnpm outdated -r --filter !./vendor/**'
	pnpm outdated -r --filter '!./vendor/**' || true
	exit 0
fi
echo "\$ pnpm update -r --filter !./vendor/**${major:+ --latest}"
if ! out=$(pnpm update -r --filter '!./vendor/**' ${major:+--latest} 2>&1); then
	echo "$out"
	echo "$out" | grep -q ERR_PNPM_NO_MATURE_MATCHING_VERSION || exit 1
	echo "held by the supply-chain delay, nothing moved in the pnpm half; run again once it has aged"
else
	echo "$out"
fi
# The filter leaves vendor/'s own dependencies where the lockfile had them, so a package both sides
# use resolves twice -- two vites, whose ResolvedConfig types then compare against each other
# until tsc runs out of stack. dedupe moves vendor/'s within the ranges its manifest already
# declares, in the lockfile alone; the manifest stays upstream's.
echo
echo '$ pnpm dedupe'
pnpm dedupe
v=$(mise current pnpm)
perl -pi -e "s/\"packageManager\": \"pnpm\@[^\"]+\"/\"packageManager\": \"pnpm\@$v\"/" package.json
[ -z "$major" ] || exit 0
echo
echo "Beyond the ranges the manifests declare:"
if cargo upgrade --version >/dev/null 2>&1; then
	beyond=$(cargo upgrade --incompatible --dry-run 2>/dev/null)
	echo "${beyond:-  crates: nothing; every one is at the top of its range}"
else
	echo "  cargo upgrade is missing, so no crate's major was checked; cargo-edit supplies it"
fi
pnpm outdated -r --filter '!./vendor/**' || true
'''

# The file set is jj.toml's, so `fmt` and the formatting a commit gets agree; .oxfmtrc.json one
# directory up keeps vendor/ out of it.
[tasks.fmt]
description = "Format the Rust and the TypeScript, Svelte and prose, with jj.toml's formatters: `fmt [--dry-run]`"
usage = 'flag "-n --dry-run" help="List the files that would change and write nothing"'
run = '''
files='**/*.{ts,tsx,mts,cts,js,mjs,cjs,jsx,css,json,jsonc,md,svelte}'
if [ -n "${usage_dry_run:-}" ]; then
	cargo fmt --all --check --message-format short || true
	oxfmt --list-different --no-error-on-unmatched-pattern "$files" || true
else
	cargo fmt --all
	oxfmt --no-error-on-unmatched-pattern "$files"
fi
'''
