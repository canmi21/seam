# Reached from the workspace as `//repos/seam:<task>`. Everything else this repository needs
# comes from one directory up: the formatters, the toolchain, the commit hooks. It declares no
# tools of its own because it needs none the workspace does not already carry.
#
# The layout is crates/ for Rust and pkgs/ for TypeScript. There is no Cargo.toml yet, because
# cargo rejects a members glob that matches nothing; the Rust workspace arrives with the first
# crate.
#
# Every task names pkgs/ rather than the repository root, which is what keeps refs/ out. That
# tree is the previous version, kept to be read: holding a frozen codebase to the current
# toolchain would be a gate nobody should ever have to satisfy, and oxlint had plenty to say
# about it.

[tasks.check]
description = "Type-check every package"
run = "pnpm exec tsc"

[tasks.lint]
description = "Lint the packages"
run = "oxlint pkgs"

[tasks.test]
description = "Check both seams with Svelte: the AST we read and the HTML we emit"
run = [
	"node pkgs/ast/conformance/run.ts",
	"node pkgs/injector/conformance/run.ts",
]

[tasks.dev]
description = "Serve the fixture route: `dev` then open http://localhost:5100"
run = "node pkgs/server/src/main.ts"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "lint", "test"]
