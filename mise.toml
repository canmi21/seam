# Reached from the workspace as `//repos/seam:<task>`. Everything else this repository needs
# comes from one directory up: the formatters, the toolchain, the commit hooks. It declares no
# tools of its own because it needs none the workspace does not already carry.
#
# The layout is crates/ for Rust, pkgs/ for TypeScript, corpus/ for the fixtures both read, and
# vendor/ for source taken from elsewhere, which has checks of its own (see vendor/README.md).

[tasks.check]
description = "Type-check every package"
run = "pnpm exec tsc"

[tasks.check-rust]
description = "Type-check every crate"
run = "cargo check --workspace --all-targets"

[tasks.lint]
description = "Lint the packages"
run = "oxlint pkgs"

[tasks.lint-rust]
description = "Lint every crate, warnings denied"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test-rust]
description = "Close the loop: markup fixture, lowering, the IR the specification describes"
run = "cargo test --workspace"

[tasks.test]
description = "Check every seam with Svelte: the AST we read, what we refuse, and the HTML we emit"
# The TypeScript checks call lowering through the WebAssembly build, so a change to a crate that
# is not followed by rebuilding it tests a compiler that no longer exists. Depending on `wasm`
# closes that: cargo and mise both skip work that is up to date, so an unchanged crate costs
# nothing here.
depends = ["wasm"]
# NODE_ENV before the runner rather than inside it. Svelte reads `DEV` from `esm-env`, which is
# true for any value that is set and does not begin with `prod`, and vitest sets `test`. Its
# development runtime writes a hash of the value into the anchor that opens a `{@html}` block, so
# the compiler would render bytes no server ships. `skeleton()` refuses to compile under it, and
# this is the environment it asks for. Setting it from inside the configuration is too late: the
# value is read when the module graph loads.
run = "NODE_ENV=production pnpm exec vitest run"

[tasks.test-vendor]
description = "Run SvelteKit's own checks over the vendored source, upstream's Node half"
# From the vendor directory, under its own config: the repository's `test` does not include it,
# and its config is not a `vitest.config.*` so the root run does not pick it up either. See
# vendor/kit/VENDOR.md.
dir = "vendor/kit"
run = "pnpm exec vitest run --config vitest.config.ts"

[tasks.build]
description = "Compile the corpus routes into dist/, which is the artifact a server reads"
# The lowering module is not committed, so the step that needs it builds it.
depends = ["wasm"]
# A URL and a component for each route. Routing does not exist, so they are named rather than
# found, and this is what the plugin's configuration will do; see spec/build.md.
run = "node pkgs/compiler/src/main.ts corpus/cases dist pkgs/server/app.html /=product.svelte /carried=carried.svelte /head=head.svelte"

[tasks.dev]
description = "Serve what the compiler wrote: `build`, then `dev`, then open http://localhost:5100"
depends = ["build"]
run = "node pkgs/server/src/main.ts"

[tasks.wasm]
description = "Build the lowering pass as one WebAssembly file the compiler can call"
# Skipped by mise when the module is newer than every source it is built from, which is what
# lets `test` depend on it without paying for a build nothing changed.
sources = ["crates/**/*.rs", "crates/**/Cargo.toml", "Cargo.toml", "Cargo.lock"]
outputs = ["pkgs/lowering/lowering.wasm"]
# Run from the repository so the pinned toolchain is the one that resolves: outside it, the
# wasm target is not found, which fails in a way that names the wrong thing.
run = [
	"cargo build -q --release --target wasm32-unknown-unknown -p lowering",
	# Raw output carries the whole standard library. Dropping what nothing reaches takes it from
	# 1.6MB to 15KB, and the result runs identically.
	"wasm-opt -Oz --enable-bulk-memory --enable-nontrapping-float-to-int --strip-debug --strip-producers target/wasm32-unknown-unknown/release/lowering.wasm -o pkgs/lowering/lowering.wasm",
	"ls -l pkgs/lowering/lowering.wasm",
]

[tasks.fixtures]
description = "Regenerate the corpus after changing a case"
# The lowering module is not committed, so the step that needs it builds it.
depends = ["wasm"]
run = [
	"node corpus/generate.ts",
	"node crates/devalue/fixtures/generate.ts",
]

[tasks.e2e]
description = "The two claims a DOM implementation cannot settle, in a real browser"
# Not part of `verify`: it needs a browser on the machine, and it is one step rather than the
# suite. It uses the Chrome that is installed rather than downloading one. See spec/build.md.
run = "NODE_ENV=production pnpm exec vitest run --config vitest.e2e.config.ts"

[tasks.verify]
description = "Everything a change has to pass"
depends = ["check", "check-rust", "lint", "lint-rust", "test", "test-rust"]
