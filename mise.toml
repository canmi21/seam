# Reached from the workspace as `//repos/seam:<task>`. Everything else this repository needs
# comes from one directory up: the formatters, the toolchain, the commit hooks. It declares no
# tools of its own because it needs none the workspace does not already carry.
#
# The v2 tree has no code yet, so there is nothing to type-check, lint or test. The tasks arrive
# with it, and until then verify says what it did rather than passing silently -- a green check
# that checked nothing is worse than a loud empty one.
#
# refs/ is deliberately not verified. It is the previous version, kept to be read; holding a
# frozen tree to the current toolchain would be a gate nobody should ever have to satisfy.

[tasks.verify]
description = "Everything a change has to pass"
run = "echo 'seam: no v2 code yet, nothing to verify'"
