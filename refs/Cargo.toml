# The v1 tree, kept to be read. It still resolves as a cargo workspace so an editor can
# jump through it; nothing here is built or published. See the observation branch for
# what was removed. A future workspace at the repository root must exclude this one.
[workspace]
resolver = "3"
members = [
	"src/server/core/rust",
	"src/server/core/rust-macros",
	"src/server/injector/rust",
	"src/server/engine/rust",
	"src/cli/skeleton",
	"src/cli/codegen",
]

[workspace.lints.clippy]
too_many_lines = "warn"
# pedantic (individually selected)
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
uninlined_format_args = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
# restriction / nursery
dbg_macro = "deny"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unwrap_used = "warn"

[workspace.package]
version = "0.5.38"
edition = "2024"
license = "MIT"
authors = ["Canmi(Canmi21) <t@canmi.icu>"]
repository = "https://github.com/canmi21/seam"
